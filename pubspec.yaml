name: melodia
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+8

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  audioplayers: ^6.8.1
  sign_in_with_apple: ^6.1.4
  video_player: ^2.9.5
  chewie: ^1.8.5
  flutter_secure_storage: ^9.2.4
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  in_app_purchase: ^3.2.0
  in_app_purchase_storekit: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/videos/
    - assets/images/

# YENİ: App Icon'u tek komutla (dart run flutter_launcher_icons) hem iOS
# hem Android için tüm gerekli boyutlarda otomatik üretir. Kaynak görsel
# assets/icon/icon.png -- 1024x1024, şeffaflık YOK (App Store bunu kabul
# etmiyor, remove_alpha_ios bunu garanti altına alıyor).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true